<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Spencer Presley</title>
  <desc id="description">AI and backend systems that hold up outside the demo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171126"/>
      <stop offset="0.52" stop-color="#09090b"/>
      <stop offset="1" stop-color="#07181d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(145 115) rotate(35) scale(455 360)">
      <stop stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky-glow" cx="0" cy="0" r="1" gradientTransform="translate(1110 560) rotate(-145) scale(430 345)">
      <stop stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#violet-glow)"/>
  <rect width="1200" height="630" fill="url(#sky-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="64" y="58" width="1072" height="514" rx="28" fill="#09090b" fill-opacity="0.48" stroke="#ffffff" stroke-opacity="0.11"/>
  <rect x="64" y="58" width="1072" height="3" rx="1.5" fill="url(#accent)"/>

  <g transform="translate(112 112)">
    <rect y="8" width="42" height="2" rx="1" fill="#a78bfa"/>
    <text x="62" y="18" fill="#c4b5fd" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4">SPENCER PRESLEY</text>

    <text y="142" fill="#fafafa" font-family="Inter, Arial, Helvetica, sans-serif" font-size="70" font-weight="750" letter-spacing="-2.8">
      <tspan x="0">AI and backend systems</tspan>
      <tspan x="0" dy="82">that hold up outside the demo.</tspan>
    </text>

    <text y="375" fill="#a1a1aa" font-family="Inter, Arial, Helvetica, sans-serif" font-size="23" letter-spacing="0.2">Local AI · reliable backends · platform engineering</text>
  </g>

  <g transform="translate(112 530)">
    <text fill="#d4d4d8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">SPENCERPRESLEY.COM</text>
    <circle cx="806" cy="-5" r="5" fill="#38bdf8"/>
    <text x="824" fill="#71717a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">01 / PORTFOLIO</text>
  </g>
</svg>
